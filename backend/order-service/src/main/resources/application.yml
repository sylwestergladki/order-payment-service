spring:
    application:
        name: order-service

    cache:
        type: redis

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}

    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
        username: ${DB_USER:order}
        password: ${DB_PASSWORD:order}
        driver-class-name: org.postgresql.Driver

    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
    port: ${SERVER_PORT:8080}

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus

    tracing:
        sampling:
            probability: 1.0

    otlp:
        tracing:
            endpoint: ${OTEL_ENDPOINT:http://localhost:4318/v1/traces}

logging:
    pattern:
        level: "%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}]"