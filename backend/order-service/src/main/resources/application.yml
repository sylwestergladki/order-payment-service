spring:
    application:
        name: order-service

    cache:
        type: redis

    data:
        redis:
            host: localhost
            port: 6379
    datasource:
        url: jdbc:postgresql://localhost:5432/orderdb
        username: order
        password: order
        driver-class-name: org.postgresql.Driver
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
    kafka:
        bootstrap-servers: localhost:9092

server:
    port: 8080

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    tracing:
        sampling:
            probability: 1.0
    otlp:
        tracing:
            endpoint: http://localhost:4318/v1/traces
logging:
    pattern:
        level: "%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}]"