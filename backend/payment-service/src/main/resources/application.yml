spring:
    application:
        name: payment-service
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentdb}
        username: ${DB_USER:order}
        password: ${DB_PASSWORD:order}
        driver-class-name: org.postgresql.Driver
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

outbox:
    retry:
        max-retries: 5
        base-delay-seconds: 30
        max-delay-seconds: 900
        jitter-factor: 0.3

server:
    port: 8082

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus

    endpoint:
        health:
            show-details: always

    metrics:
        tags:
            application: payment-service
    tracing:
        sampling:
            probability: 1.0
    otlp:
        tracing:
            endpoint: ${OTEL_ENDPOINT:http://localhost:4318/v1/traces}
logging:
    pattern:
        level: "%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}]"